name: API 自动化测试

# 什么时候触发：每次推送代码或 Pull Request 时
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: 检出代码
        uses: actions/checkout@v4

      # 2. 安装 Python
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. 安装依赖
      - name: 安装项目依赖
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests allure-pytest pyyaml

      # 4. 运行测试
      - name: 运行测试
        run: |
          python -m pytest testcases/ --alluredir=reports -v

      # 5. 上传测试报告（可选，失败时可下载查看）
      - name: 上传 Allure 报告数据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: reports/